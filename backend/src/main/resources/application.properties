spring.application.name=API Eventos Culturales Puertollano

# Configuración de conexión a la BD (con fallbacks para desarrollo local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventos_culturales?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8081}

# 014: tamaño de página fijo en servidor (?size= no se expone al cliente)
app.paginacion.size=10

# Clave secreta JWT (32 bytes en Base64, ej: openssl rand -base64 32).
# OBLIGATORIA también en local: el default es cadena vacía a propósito (NO es una clave
# usable) para que el fail-fast lo haga JwtSecretKeyProvider con mensaje claro en vez
# de un error críptico de placeholder. Sin JWT_SECRET la app no arranca.
jwt.secret=${JWT_SECRET:}

# Subida de carteles: solo JPEG/PNG/GIF (se valida en el controller), máx 2 MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Rate limiting de login: intentos máximos por email+IP en la ventana (segundos)
app.security.login-rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.security.login-rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

# Cookie de refresh: en producción poner COOKIE_SECURE=true (HTTPS)
app.cookie.secure=${COOKIE_SECURE:false}

# SameSite de la cookie: Lax en local; None en producción (frontend y backend en distinto origen)
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# CORS: en producción fijar el origen del frontend, ej: CORS_ALLOWED_ORIGINS=https://mi-frontend.onrender.com
# (sin "null": el desarrollo local se sirve por Apache/XAMPP, no por file://)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Email de notificaciones (US6 007, Mailtrap): sin defaults inseguros.
# Sin estas vars el arranque NO falla (el envío simplemente fallará y se logueará,
# sin revertir nada — FR-013); para notificar de verdad, fijar las 4 en el entorno.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
