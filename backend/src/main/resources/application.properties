spring.application.name=API Eventos Culturales Puertollano

# Configuración de conexión a la BD (con fallbacks para desarrollo local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventos_culturales?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8081}

# Clave secreta JWT (32 bytes en Base64, ej: openssl rand -base64 32)
jwt.secret=${JWT_SECRET:***REMOVED-SECRET***}

# Subida de carteles: solo JPEG/PNG/GIF (se valida en el controller), máx 2 MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Cookie de refresh: en producción poner COOKIE_SECURE=true (HTTPS)
app.cookie.secure=${COOKIE_SECURE:false}

# SameSite de la cookie: Lax en local; None en producción (frontend y backend en distinto origen)
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# CORS: en producción fijar el origen del frontend, ej: CORS_ALLOWED_ORIGINS=https://mi-frontend.onrender.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,null}
